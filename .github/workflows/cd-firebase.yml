name: CD Firebase Staging

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  deploy-staging:
    if: github.event.pull_request.merged == true  # Only PR merged
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4️⃣ Grant permission cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5️⃣ Build staging APK
      - name: Build Staging APK
        run: ./gradlew assembleStaging --stacktrace

      # 6️⃣ Upload to Firebase App Distribution
      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: app/build/outputs/apk/staging/app-staging.apk
